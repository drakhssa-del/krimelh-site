<meta charset="UTF-8">
<title>Krimelh</title>
<style>
  :root{
    --ink:#050506;
    --ink-2:#0a0a0c;
    --cream:#efe7da;
    --cream-dim:#efe7da99;
    --violet:#c026ff;
    --acid:#39ff8f;
    --grain-op:0.16;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:'Space Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- stage ---------- */
  .stage{
    position:relative;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 20px calc(40px + env(safe-area-inset-bottom,0px));
    text-align:center;
    isolation:isolate;
  }

  /* vignette, pure black & white — old film stock, no color wash */
  .stage::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(255,255,255,0.06), transparent 60%),
      radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(0,0,0,0.9) 100%);
    z-index:1;
    pointer-events:none;
  }

  /* film grain layer */
  .grain{
    position:fixed; inset:-10%;
    width:120%; height:120%;
    z-index:2;
    pointer-events:none;
    opacity:var(--grain-op);
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grainShift 0.5s steps(4) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0);}
    25%{transform:translate(-2%,1%);}
    50%{transform:translate(1%,-2%);}
    75%{transform:translate(-1%,-1%);}
    100%{transform:translate(2%,2%);}
  }

  /* vertical scratches, old-reel style */
  .scratches{
    position:fixed; inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.5;
  }
  .scratches span{
    position:absolute;
    top:-5%; height:110%;
    width:1px;
    background:rgba(239,231,218,0.5);
    animation:flicker-scratch linear infinite;
  }
  @keyframes flicker-scratch{
    0%,94%{opacity:0;}
    95%{opacity:.7; transform:translateX(0);}
    96%{opacity:0;}
    97%{opacity:.4; transform:translateX(2px);}
    100%{opacity:0;}
  }

  /* subtle overall brightness flicker like unstable projector bulb */
  .flicker-veil{
    position:fixed; inset:0;
    z-index:4;
    pointer-events:none;
    background:#000;
    opacity:0;
    animation:bulbFlicker 6.5s steps(1,end) infinite;
  }
  @keyframes bulbFlicker{
    0%,100%{opacity:0;}
    41%{opacity:0;}
    42%{opacity:.10;}
    43%{opacity:0;}
    77%{opacity:0;}
    78%{opacity:.14;}
    79%{opacity:0;}
    88%{opacity:0;}
    89%{opacity:.06;}
    90%{opacity:0;}
  }

  .content{position:relative; z-index:5; width:100%; max-width:1180px;}

  /* ---------- wordmark: the real Krimelh splatter lettering, purple idle / acid-green hover ---------- */
  .logo-wrap{
    width:100%;
    margin:0 auto;
  }
  .logo-wrap svg{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
  }
  .logo-wrap a{
    cursor:pointer;
    outline:none;
    -webkit-tap-highlight-color:transparent;
  }
  .logo-wrap a:focus{outline:none;}
  .logo-wrap .letter{
    fill:transparent;
    stroke:var(--violet);
    stroke-width:1.4;
    stroke-linejoin:round;
    animation: letterPulse var(--pulse-dur, 4s) ease-in-out var(--pulse-delay, 0s) infinite;
    transition:stroke .25s ease;
  }
  /* each letter breathes at its own slow, slightly different tempo */
  .logo-wrap a[data-letter="K"] .letter{ --pulse-dur:4.6s; --pulse-delay:0s; }
  .logo-wrap a[data-letter="R"] .letter{ --pulse-dur:5.3s; --pulse-delay:.6s; }
  .logo-wrap a[data-letter="I"] .letter{ --pulse-dur:3.9s; --pulse-delay:1.1s; }
  .logo-wrap a[data-letter="M"] .letter{ --pulse-dur:5.8s; --pulse-delay:.2s; }
  .logo-wrap a[data-letter="E"] .letter{ --pulse-dur:4.2s; --pulse-delay:1.6s; }
  .logo-wrap a[data-letter="L"] .letter{ --pulse-dur:5.1s; --pulse-delay:.9s; }
  .logo-wrap a[data-letter="H"] .letter{ --pulse-dur:4.9s; --pulse-delay:.4s; }

  @keyframes letterPulse{
    0%, 100%{
      opacity:.72;
      filter:
        drop-shadow(0 0 1px rgba(192,38,255,0.6))
        drop-shadow(0 0 3px rgba(192,38,255,0.3));
    }
    50%{
      opacity:1;
      filter:
        drop-shadow(0 0 2px rgba(192,38,255,1))
        drop-shadow(0 0 10px rgba(192,38,255,0.7));
    }
  }

  .logo-wrap a:hover .letter,
  .logo-wrap a:focus-visible .letter{
    stroke:var(--acid);
    animation:none;
    opacity:1;
    filter:
      drop-shadow(0 0 1px rgba(57,255,143,0.95))
      drop-shadow(0 0 7px rgba(57,255,143,0.6));
    outline:none;
  }

  @media (prefers-reduced-motion: reduce){
    .logo-wrap .letter{animation:none; opacity:1;}
  }

  .hint{
    margin-top:58px;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .handwrite{
    position:relative;
    display:inline-block;
    font-family:'Dancing Script','Cinzel',cursive;
    font-weight:600;
    font-style:italic;
    font-size:17px;
    letter-spacing:.01em;
    color:var(--cream-dim);
    white-space:nowrap;
    -webkit-clip-path: inset(0 100% 0 0);
    clip-path: inset(0 100% 0 0);
    animation: handwriteLoop 6s ease-in-out infinite;
  }

  @keyframes handwriteLoop{
    0%   { -webkit-clip-path: inset(0 100% 0 0); clip-path: inset(0 100% 0 0); opacity:1; }
    48%  { -webkit-clip-path: inset(0 0% 0 0);   clip-path: inset(0 0% 0 0);   opacity:1; }
    72%  { -webkit-clip-path: inset(0 0% 0 0);   clip-path: inset(0 0% 0 0);   opacity:1; }
    86%  { -webkit-clip-path: inset(0 0% 0 0);   clip-path: inset(0 0% 0 0);   opacity:0; }
    87%  { -webkit-clip-path: inset(0 100% 0 0); clip-path: inset(0 100% 0 0); opacity:0; }
    100% { -webkit-clip-path: inset(0 100% 0 0); clip-path: inset(0 100% 0 0); opacity:1; }
  }

  .enter-word{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--violet);
    text-decoration:none;
    border-bottom:1px solid rgba(192,38,255,0.4);
    padding-bottom:1px;
    display:inline-block;
    transition:color .2s ease, border-color .2s ease;
    animation: enterPulse 2.4s ease-in-out infinite;
  }
  .enter-word:hover, .enter-word:focus-visible{
    color:var(--acid);
    border-color:rgba(57,255,143,0.6);
    animation-play-state:paused;
    opacity:1;
    transform:scale(1.12);
  }

  @keyframes enterPulse{
    0%, 100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.12); }
  }

  @media (prefers-reduced-motion: reduce){
    .handwrite{ animation:none; -webkit-clip-path:none; clip-path:none; }
    .enter-word{ animation:none; opacity:1; transform:none; }
  }

  footer.credit{
    position:relative; z-index:5;
    padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));
    text-align:center;
    font-size:9px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#efe7da55;
  }

  @media (max-width:560px){
    .stage{padding-top:64px;}
  }

  @media (prefers-reduced-motion: reduce){
    .grain, .flicker-veil, .scratches span{animation:none !important;}
  }
</style>
