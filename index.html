<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krimelh</title>
<style>
  :root{
    --ink:#050506;
    --ink-2:#0a0a0c;
    --cream:#efe7da;
    --cream-dim:#efe7da99;
    --violet:#c026ff;
    --acid:#39ff8f;
    --grain-op:0.16;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:'Space Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- stage ---------- */
  .stage{
    position:relative;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 20px calc(40px + env(safe-area-inset-bottom,0px));
    text-align:center;
    isolation:isolate;
  }

  /* vignette, pure black & white — old film stock, no color wash */
  .stage::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(255,255,255,0.06), transparent 60%),
      radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(0,0,0,0.9) 100%);
    z-index:1;
    pointer-events:none;
  }

  /* film grain layer */
  .grain{
    position:fixed; inset:-10%;
    width:120%; height:120%;
    z-index:2;
    pointer-events:none;
    opacity:var(--grain-op);
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grainShift 0.5s steps(4) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0);}
    25%{transform:translate(-2%,1%);}
    50%{transform:translate(1%,-2%);}
    75%{transform:translate(-1%,-1%);}
    100%{transform:translate(2%,2%);}
  }

  /* vertical scratches, old-reel style */
  .scratches{
    position:fixed; inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0.5;
  }
  .scratches span{
    position:absolute;
    top:-5%; height:110%;
    width:1px;
    background:rgba(239,231,218,0.5);
    animation:flicker-scratch linear infinite;
  }
  @keyframes flicker-scratch{
    0%,94%{opacity:0;}
    95%{opacity:.7; transform:translateX(0);}
    96%{opacity:0;}
    97%{opacity:.4; transform:translateX(2px);}
    100%{opacity:0;}
  }

  /* subtle overall brightness flicker like unstable projector bulb */
  .flicker-veil{
    position:fixed; inset:0;
    z-index:4;
    pointer-events:none;
    background:#000;
    opacity:0;
    animation:bulbFlicker 6.5s steps(1,end) infinite;
  }
  @keyframes bulbFlicker{
    0%,100%{opacity:0;}
    41%{opacity:0;}
    42%{opacity:.10;}
    43%{opacity:0;}
    77%{opacity:0;}
    78%{opacity:.14;}
    79%{opacity:0;}
    88%{opacity:0;}
    89%{opacity:.06;}
    90%{opacity:0;}
  }

  .content{position:relative; z-index:5; width:100%; max-width:1180px;}

  /* ---------- hero photo, above the wordmark ---------- */
  .hero-photo-wrap{
    margin:0 auto 32px;
    max-width:300px;
  }
  .hero-photo-wrap img{
    display:block;
    width:100%;
    height:auto;
    border-radius:3px;
    filter:contrast(1.08) saturate(0.92);
    box-shadow:0 0 50px rgba(192,38,255,0.28), 0 0 110px rgba(192,38,255,0.12);
  }

  /* ---------- wordmark: the real Krimelh logo (original image, untouched) with a per-letter glow layer ---------- */
  .logo-wrap{
    width:100%;
    margin:0 auto;
  }
  .logo-wrap svg{
    width:100%;
    height:auto;
    max-height:68dvh;
    display:block;
    overflow:visible;
  }
  .logo-wrap a{
    cursor:pointer;
    outline:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
  }
  .logo-wrap a:focus{outline:none;}
  .logo-wrap .hit{
    fill:#000; fill-opacity:0; stroke:none;
    pointer-events:all; outline:none;
  }
  .logo-wrap .glow{
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    animation: letterBreath var(--pulse-dur, 4s) ease-in-out var(--pulse-delay, 0s) infinite;
  }
  /* each letter breathes at its own slow, slightly different tempo */
  .logo-wrap a[data-letter="K"] .glow{ --pulse-dur:4.6s; --pulse-delay:0s; }
  .logo-wrap a[data-letter="R"] .glow{ --pulse-dur:5.3s; --pulse-delay:.6s; }
  .logo-wrap a[data-letter="I"] .glow{ --pulse-dur:3.9s; --pulse-delay:1.1s; }
  .logo-wrap a[data-letter="M"] .glow{ --pulse-dur:5.8s; --pulse-delay:.2s; }
  .logo-wrap a[data-letter="E"] .glow{ --pulse-dur:4.2s; --pulse-delay:1.6s; }
  .logo-wrap a[data-letter="L"] .glow{ --pulse-dur:5.1s; --pulse-delay:.9s; }
  .logo-wrap a[data-letter="H"] .glow{ --pulse-dur:4.9s; --pulse-delay:.4s; }
  .logo-wrap a[data-letter="X"] .glow{ --pulse-dur:5.5s; --pulse-delay:1.3s; }

  @keyframes letterBreath{
    0%, 100%{ opacity:0; }
    50%{ opacity:.28; }
  }

  .logo-wrap a:hover .glow,
  .logo-wrap a:focus-visible .glow{
    animation:none;
    opacity:1;
  }

  @media (prefers-reduced-motion: reduce){
    .logo-wrap .glow{animation:none;}
  }

  .hint{
    margin-top:58px;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .handwrite{
    position:relative;
    display:inline-block;
    font-family:'Dancing Script','Cinzel',cursive;
    font-weight:600;
    font-style:italic;
    font-size:17px;
    letter-spacing:.01em;
    color:var(--cream-dim);
    white-space:nowrap;
    -webkit-clip-path: inset(0 100% 0 0);
    clip-path: inset(0 100% 0 0);
    animation: handwriteLoop 6s ease-in-out infinite;
  }

  @keyframes handwriteLoop{
    0%   { -webkit-clip-path: inset(0 100% 0 0); clip-path: inset(0 100% 0 0); opacity:1; }
    48%  { -webkit-clip-path: inset(0 0% 0 0);   clip-path: inset(0 0% 0 0);   opacity:1; }
    72%  { -webkit-clip-path: inset(0 0% 0 0);   clip-path: inset(0 0% 0 0);   opacity:1; }
    86%  { -webkit-clip-path: inset(0 0% 0 0);   clip-path: inset(0 0% 0 0);   opacity:0; }
    87%  { -webkit-clip-path: inset(0 100% 0 0); clip-path: inset(0 100% 0 0); opacity:0; }
    100% { -webkit-clip-path: inset(0 100% 0 0); clip-path: inset(0 100% 0 0); opacity:1; }
  }

  .enter-word{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--violet);
    text-decoration:none;
    border-bottom:1px solid rgba(192,38,255,0.4);
    padding-bottom:1px;
    display:inline-block;
    transition:color .2s ease, border-color .2s ease;
    animation: enterPulse 2.4s ease-in-out infinite;
  }
  .enter-word:hover, .enter-word:focus-visible{
    color:var(--acid);
    border-color:rgba(57,255,143,0.6);
    animation-play-state:paused;
    opacity:1;
    transform:scale(1.12);
  }

  @keyframes enterPulse{
    0%, 100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.12); }
  }

  @media (prefers-reduced-motion: reduce){
    .handwrite{ animation:none; -webkit-clip-path:none; clip-path:none; }
    .enter-word{ animation:none; opacity:1; transform:none; }
  }

  footer.credit{
    position:relative; z-index:5;
    padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));
    text-align:center;
    font-size:9px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#efe7da55;
  }

  @media (max-width:560px){
    .stage{padding-top:64px;}
  }

  @media (prefers-reduced-motion: reduce){
    .grain, .flicker-veil, .scratches span{animation:none !important;}
  }
</style>

<style>
  /* ---- fondo: siluetas de la bicicleta penny farthing flotando ---- */
  .bg-glyphs{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:-1; }
  .bg-glyphs svg.glyph{
    position:absolute;
    fill:none;
    stroke:rgba(200,200,205,.16);
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .bg-glyphs .g1{ width:130px; top:6%;  left:-14%; animation:driftA 70s linear infinite; }
  .bg-glyphs .g2{ width:70px;  top:62%; left:-12%; animation:driftB 95s linear infinite; animation-delay:-20s; }
  .bg-glyphs .g3{ width:170px; top:28%; left:-16%; animation:driftC 120s linear infinite; animation-delay:-50s; }
  .bg-glyphs .g4{ width:95px;  top:80%; left:-10%; animation:driftA 85s linear infinite; animation-delay:-35s; }
  .bg-glyphs .g5{ width:55px;  top:14%; left:-8%;  animation:driftB 60s linear infinite; animation-delay:-10s; }
  @keyframes driftA{
    0%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(132vw,6vh) rotate(10deg); }
    100%{ transform:translate(0,0) rotate(0deg); }
  }
  @keyframes driftB{
    0%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(132vw,-8vh) rotate(-8deg); }
    100%{ transform:translate(0,0) rotate(0deg); }
  }
  @keyframes driftC{
    0%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(136vw,4vh) rotate(5deg); }
    100%{ transform:translate(0,0) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .bg-glyphs .glyph{ animation:none !important; }
  }
</style>
